[project]
name = "findata"
version = "0.1.0"
description = "Finance data engine demo: month-end reporting automation and budget-vs-actual on fictitious data"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "pandas>=2.2",
    "numpy>=1.26",
    "openpyxl>=3.1",
    "xlsxwriter>=3.2",
    "plotly>=5.24",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
